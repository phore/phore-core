name: tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: yaml, sodium, mbstring
        coverage: none
    - run: composer install --prefer-dist --no-interaction
    - run: composer test
